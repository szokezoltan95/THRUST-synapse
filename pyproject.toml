[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thrust-synapse"
version = "0.1.0"
description = "Synthetic data and neural identification tools for THRUST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
thrust-synapse-generate = "thrust_synapse.dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
