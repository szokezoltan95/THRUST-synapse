[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thrust-synapse"
version = "0.1.0"
description = "Synthetic data and neural identification tools for THRUST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.2", "matplotlib>=3.7"]

[project.scripts]
thrust-synapse-generate = "thrust_synapse.dataset:main"
thrust-synapse-train = "thrust_synapse.train:main"

[tool.setuptools.packages.find]
where = ["src"]
